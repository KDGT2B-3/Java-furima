spring.application.name=JavaFurim
server.port=${SERVER_PORT:8080}

# =========================================
#  Database Settings (PostgreSQL)
# =========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/javafurimdb
spring.datasource.username=postgres
spring.datasource.password=1240isshinkO
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# =========================================
#  JPA / Hibernate
# =========================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL 初期化（schema.sql / data.sql）
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# =========================================
#  Thymeleaf
# =========================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# =========================================
#  Actuator
# =========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =========================================
#  Stripe (キー名完全修正)
#  ※ コードで参照されているキー：stripe.public.key / stripe.secret.key
# =========================================
stripe.public.key=dummy
stripe.secret.key=dummy

# （必要なら他も残してOK）
stripe.public-key=dummy
stripe.secret-key=dummy
stripe.api.secretKey=dummy
stripe.api.publicKey=dummy

# =========================================
#  Cloudinary
# =========================================
cloudinary.cloud_name=dummy
cloudinary.api_key=dummy
cloudinary.api_secret=dummy

# =========================================
#  LINE Notify
# =========================================
line.notify.endpoint=${LINE_NOTIFY_ENDPOINT:https://notify-api.line.me/api/notify}
line.notify.token=${LINE_NOTIFY_TOKEN:}

# =========================================
#  Logging
# =========================================
logging.level.root=${LOGGING_LEVEL:INFO}
logging.level.org.springframework.security=INFO
