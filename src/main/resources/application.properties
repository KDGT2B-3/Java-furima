spring.application.name=JavaFurim
server.port=${SERVER_PORT:8080}

# =========================================
#  Database Settings (PostgreSQL)
# =========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/javafurimdb
spring.datasource.username=postgres
spring.datasource.password=1240isshinkO
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# =========================================
#  JPA / Hibernate
# =========================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL 初期化
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# =========================================
#  Thymeleaf
# =========================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# =========================================
#  Stripe (★ここを修正)
#  コントローラー側が stripe.public.key (ドット区切り) を探している場合、
#  プロパティ名も完全に一致させる必要があります。
# =========================================
stripe.public.key=${STRIPE_PUBLIC_KEY:}
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.api.secretKey=${STRIPE_SECRET_KEY:}
stripe.api.publicKey=${STRIPE_PUBLIC_KEY:}

# =========================================
#  Cloudinary
# =========================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# =========================================
#  LINE Notify
# =========================================
line.notify.endpoint=${LINE_NOTIFY_ENDPOINT:https://notify-api.line.me/api/notify}
line.notify.token=${LINE_NOTIFY_TOKEN:}

# =========================================
#  Logging
# =========================================
logging.level.root=${LOGGING_LEVEL:INFO}
logging.level.org.springframework.security=INFO