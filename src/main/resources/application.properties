spring.application.name=JavaFurim
server.port=${SERVER_PORT:8080}

# =========================================
#  Database Settings (PostgreSQL)
# =========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/javafurimdb
spring.datasource.username=postgres
spring.datasource.password=1240isshinkO
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# =========================================
#  JPA / Hibernate
# =========================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL 初期化
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# =========================================
#  Thymeleaf
# =========================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# =========================================
#  Spring MVC (PUT/DELETE メソッド対応)
# =========================================
spring.mvc.hiddenmethod.filter.enabled=true

# =========================================
#  Actuator (ヘルスチェック)
# =========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

