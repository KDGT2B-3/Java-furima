spring.application.name=JavaFurim
server.port=${SERVER_PORT:8080}

# =========================================
#  Database Settings (PostgreSQL)
# =========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/javafurimdb
spring.datasource.username=postgres
spring.datasource.password=1240isshinkO
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# =========================================
#  JPA / Hibernate
# =========================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL 初期化
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# =========================================
#  Thymeleaf
# =========================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# =========================================
#  Spring MVC (PUT/DELETE メソッド対応)
# =========================================
spring.mvc.hiddenmethod.filter.enabled=true

# =========================================
#  Actuator (ヘルスチェック)
# =========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =========================================
#  Stripe
# =========================================
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_dummy}
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_dummy}
stripe.api.secretKey=${STRIPE_SECRET_KEY:sk_test_dummy}

# =========================================
#  Cloudinary
# =========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dummy_cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:000000000000000}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:dummy_secret}

# =========================================
#  LINE Notify
# =========================================
line.notify.api.url=${LINE_NOTIFY_ENDPOINT:https://notify-api.line.me/api/notify}
line.notify.token=${LINE_NOTIFY_TOKEN:}

# =========================================
#  Logging
# =========================================
logging.level.root=${LOGGING_LEVEL:INFO}
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE