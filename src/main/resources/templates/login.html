<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ログイン - フリマアプリ</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div class="container">
		<h1>フリマアプリ</h1>
		<h2>ログイン</h2>

		<div th:if="${successMessage}" class="success-message" th:text="${successMessage}">
			会員登録が完了しました。
		</div>

		<form th:action="@{/login}" method="post">

			<div th:if="${param.error}" class="error-message">
				メールアドレスまたはパスワードが正しくありません。
			</div>

			<div th:if="${param.logout}" class="success-message">
				ログアウトしました。
			</div>

			<p>
				<label for="email">メールアドレス:</label>
				<input type="email" id="email" name="email" required placeholder="example@mail.com">
			</p>

			<p>
				<label for="password">パスワード:</label>
				<input type="password" id="password" name="password" required>
			</p>

			<div class="button-group">
				<button type="submit">ログイン</button>
			</div>
		</form>

		<hr>

		<div class="link-group" style="text-align: center; margin-top: 20px;">
			<p>アカウントをお持ちでない方は</p>
			<a th:href="@{/register}">こちらから新規会員登録</a>
		</div>
	</div>
</body>
</html>
